services:
  deepseek-harness:
    build:
      context: .
      args:
        DSH_VERSION: ${DSH_VERSION:-0.2.2-rc.3}
        DSH_SUPERPOWERS_VERSION: ${DSH_SUPERPOWERS_VERSION:-0.5.0}
        DSH_IM_GATEWAY_VERSION: ${DSH_IM_GATEWAY_VERSION:-0.3.5}
        IMAGE_VERSION: ${DSH_IMAGE_VERSION:-0.2.2-rc.3-r1}
        NODE_IMAGE: ${NODE_IMAGE:-docker.io/library/node:24-trixie}
        PNPM_VERSION: ${PNPM_VERSION:-10.15.1}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-deb.debian.org}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: ${DSH_IMAGE_REPOSITORY:-docker.io/runzhliu/deepseek-harness}:${DSH_IMAGE_VERSION:-0.2.2-rc.3-r1}
    container_name: ${DSH_LAN_USERNAME}-dsh
    ports:
      - "127.0.0.1:${DSH_PORT:-3080}:3080"
      - "127.0.0.1:${DSH_DESKTOP_PORT:-6080}:6080"
    environment:
      DSH_TELEMETRY_DISABLED: "1"
      DSH_DESKTOP_ENABLED: "1"
      DSH_BROWSER_USE_ENABLED: ${DSH_BROWSER_USE_ENABLED:-1}
      DSH_SUPERPOWERS_ENABLED: ${DSH_SUPERPOWERS_ENABLED:-1}
      DSH_IM_GATEWAY_ENABLED: ${DSH_IM_GATEWAY_ENABLED:-1}
      DSH_WEB_RELAY_INTERFACE: ${DSH_WEB_RELAY_INTERFACE:-}
      DSH_DESKTOP_PUBLIC_PORT: ${DSH_DESKTOP_PORT:-6080}
      HOME: /workspace
    user: "${DSH_UID:-1000}:${DSH_GID:-${DSH_UID:-1000}}"
    volumes:
      - ${DSH_WORKSPACE:-dsh-workspace}/.dsh:/home/node/.dsh
      - ${DSH_WORKSPACE:-dsh-workspace}:/workspace
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m
    # Chromium uses /dev/shm for renderer processes. This mirrors the useful
    # runtime setting from docker-antigravity without adopting its amd64-only
    # desktop base image.
      - /home/node:rw,size=1m,mode=0755
    shm_size: "1gb"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "Promise.all([fetch('http://127.0.0.1:3080/'), fetch('http://127.0.0.1:6080/vnc.html'), fetch('http://127.0.0.1:9222/json/version')]).then(([web, desktop, cdp]) => { if (web.status !== 401 || !desktop.ok || !cdp.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 3s
      start_period: 20s
      retries: 3

volumes:
  dsh-home:
  dsh-workspace:
